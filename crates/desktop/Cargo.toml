[package]
name = "auvemir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[lib]
crate-type = ["rlib"]

[dependencies]
auvemir-core = { path = "../core" }
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
tracing.workspace = true
url.workspace = true
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all", "symphonia-mpa"] }
cpal = "0.18.2"
stream-download = { version = "0.24.4", default-features = false, features = ["reqwest"] }
crossbeam-channel = "0.5"
hound = "3"
opus = "0.4.0"
ogg = "0.9"
directories = "6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
raw-window-handle = "0.6"
soundtouch = { version = "0.5.4", features = ["bundled"] }
rusty-chromaprint = "0.3"
base64 = "0.23"
webbrowser = "1.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "3.15"

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "renderer-software", "unstable-winit-030"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
keyring = "4.2.0"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06", "renderer-software"] }
jni = "0.21"
jni22 = { package = "jni", version = "0.22" }
rustls-platform-verifier = "0.7.1"
android_logger = "0.15"
ndk-context = { path = "../android-context" }
log = "0.4"
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["backend-winit", "renderer-skia"] }
libc = "0.2"
