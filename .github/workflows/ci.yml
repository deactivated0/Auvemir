name: Native quality checks
on:
  push:
    branches: [Main]
  pull_request:
    branches: [Main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux native and verification dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libasound2-dev libfontconfig1-dev libxkbcommon-dev libx11-dev ffmpeg xvfb xauth xdotool python3-pil fonts-dejavu-core
      - name: macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
      - run: cargo +1.99.0 fmt --all --check
      - run: cargo +1.99.0 clippy --locked --release --workspace --all-targets -- -D warnings
      - run: cargo +1.99.0 test --locked --release --workspace
      - run: cargo +1.99.0 build --locked --release -p auvemir -j 2
      - name: Native desktop journeys and responsive renders
        if: runner.os == 'Linux'
        run: python3 tests/verify_desktop.py target/release/auvemir --report dist/validation/desktop.json
      - name: Native and extended codec fixtures
        if: runner.os == 'Linux'
        run: python3 tests/verify_codecs.py target/release/auvemir --extended --report dist/validation/codecs.json
      - name: Real window captures
        if: runner.os == 'Linux'
        run: python3 tools/capture_screenshots.py target/release/auvemir --output dist/screenshots
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: native-validation-linux
          path: |
            dist/validation
            dist/screenshots
          if-no-files-found: ignore
