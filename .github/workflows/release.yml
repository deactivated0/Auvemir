name: Build release packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  mobile:
    uses: ./.github/workflows/mobile.yml
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, name: linux-x86_64}
          - {os: ubuntu-24.04-arm, name: linux-aarch64}
          - {os: windows-2025, name: windows-x86_64}
          - {os: macos-15-intel, name: macos-x86_64}
          - {os: macos-15, name: macos-arm64}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libasound2-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev rpm cpio zstd ffmpeg xvfb xauth xdotool python3-pil fonts-dejavu-core
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm nsis -y --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Validate source
        run: |
          cargo +1.99.0 fmt --all --check
          cargo +1.99.0 clippy --locked --release --workspace --all-targets -- -D warnings
          cargo +1.99.0 test --locked --release --workspace
      - name: Compile
        if: runner.os != 'Windows'
        run: cargo +1.99.0 build --locked --release -p auvemir -j 2
      - name: Linux codec checks and packages
        if: runner.os == 'Linux'
        run: |
          python3 tests/verify_codecs.py target/release/auvemir --extended
          python3 packaging/build_linux.py portable
          python3 packaging/build_linux.py deb
          python3 packaging/build_linux.py rpm
          python3 packaging/build_linux.py arch
          python3 packaging/build_appimage.py
          python3 tests/verify_packages.py
          mkdir -p dist/validation
          cp docs/linux-build-results.json dist/validation/packages.json
      - name: macOS packages
        if: runner.os == 'macOS'
        run: bash packaging/build_macos.sh
      - name: Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python packaging/build_windows.py --makensis 'C:\Program Files (x86)\NSIS\makensis.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: auvemir-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/*.tar.gz
            dist/*.AppImage
            dist/SHA256SUMS
            dist/appimage-tooling.json
            dist/validation
          if-no-files-found: error
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.99.0 --profile minimal
      - run: cargo +1.99.0 vendor --locked vendor > vendor-config.toml
      - run: |
          mkdir -p .cargo dist
          mv vendor-config.toml .cargo/config.toml
          tar --exclude=target --exclude=dist --exclude=.git -cJf dist/auvemir-corresponding-source.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: auvemir-corresponding-source
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: [build, source, mobile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Select release version and target
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
            tag="v$version"
            target="$GITHUB_SHA"
          else
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            target=""
          fi
          printf 'AUVEMIR_TAG=%s\nAUVEMIR_VERSION=%s\nAUVEMIR_RELEASE_TARGET=%s\n' "$tag" "$version" "$target" >> "$GITHUB_ENV"
      - name: Stage package files and reports
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import shutil
          files = [
              (artifact.name, source)
              for artifact in sorted(Path("artifacts").iterdir())
              for source in sorted(artifact.rglob("*"))
              if source.is_file() and source.name != "SHA256SUMS"
          ]
          if not files:
              raise SystemExit("No release assets were downloaded")
          counts = Counter(source.name for _, source in files)
          output = Path("release-assets")
          output.mkdir()
          for artifact, source in files:
              name = f"{artifact}-{source.name}" if counts[source.name] > 1 else source.name
              destination = output / name
              if destination.exists():
                  raise SystemExit(f"Duplicate release asset: {name}")
              shutil.copy2(source, destination)
          PY
      - name: Bundle section screenshots
        run: zip -qr "release-assets/Auvemir-${AUVEMIR_VERSION}-screenshots.zip" docs/screenshots
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          release_target=()
          if [[ -n "$AUVEMIR_RELEASE_TARGET" ]]; then
            release_target=(--target "$AUVEMIR_RELEASE_TARGET")
          else
            release_target=(--verify-tag)
          fi
          gh release create "$AUVEMIR_TAG" release-assets/* "${release_target[@]}" --draft --title "Auvemir $AUVEMIR_VERSION" --notes-file CHANGELOG.md
