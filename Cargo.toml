[workspace]
members = ["crates/core", "crates/desktop", "crates/android-context"]
exclude = ["third_party/mp4ameta"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs", "io-util", "macros", "net"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream", "form"] }
url = "2"
tracing = "0.1"
blake3 = "1"

[profile.release]
lto = false
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
debug = 0
incremental = false

# Rust 1.99/LLVM can emit empty archive members for large build dependencies
# with multiple codegen units. Keep the UI compiler's host build deterministic.
[profile.dev.build-override]
codegen-units = 1

[profile.release.build-override]
codegen-units = 1


[patch.crates-io]
ndk-context = { path = "crates/android-context" }
